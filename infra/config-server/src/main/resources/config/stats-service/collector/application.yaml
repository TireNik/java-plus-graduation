grpc:
  server:
    port: 9090
    security:
      enabled: false
spring:
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: ru.practicum.serializer.AvroSerializer

collector:
  topic:
    user-action: stats.user-actions.v1